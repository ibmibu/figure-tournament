name: Convert fighter portraits to WebP

# One-shot conversion; routine future pushes do not retrigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-fighter-portraits-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-fighter-portraits-webp
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP-capable image converter
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convert all 86 portraits and switch asset references
        run: python scripts/convert-fighter-portraits-webp.py
      - name: Validate images and references
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('public/fighters')
          assert len(list((root / 'square-v2').glob('*.webp'))) == 86
          assert not (root / 'square-v1').exists()
          manifest = Path('lib/fighter-portraits.js').read_text()
          assert manifest.count('/fighters/square-v2/') == 86
          assert '/fighters/square-v1/' not in manifest
          config = Path('next.config.js').read_text()
          assert "source: '/fighters/square-v2/:path*'" in config
          print('All 86 WebP images, manifest URLs and cache headers validated')
          PY
      - name: Commit WebP assets and remove old PNGs
        run: |
          git add -A public/fighters lib/fighter-portraits.js next.config.js
          if git diff --cached --quiet; then
            echo "Portraits already converted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert all fighter portraits to WebP and update asset references"
          git push
